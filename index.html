<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5f8">
<title>给你一个小小的惊喜</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;
 align-items:center;justify-content:center;
 padding:20px;overflow-x:hidden;
 font-family:-apple-system,BlinkMacSystemFont,
 "PingFang SC","Microsoft YaHei",sans-serif;
 color:#55434b;
 background:linear-gradient(135deg,#fff1f6,#fffafd,#f3efff);
}
.card{
 position:relative;z-index:1;
 width:100%;max-width:440px;
 padding:42px 24px;
 text-align:center;
 border:1px solid #f4dfe8;
 border-radius:28px;
 background:rgba(255,255,255,.9);
 box-shadow:0 15px 50px #8051661c;
}
h1{font-size:30px;line-height:1.6;margin:10px 0}
.pink{color:#df789b}
.aside{color:#a38e97;font-size:14px}
.deco{font-size:35px;color:#df789b}
button{
 border:0;border-radius:30px;
 padding:14px 28px;
 background:#df89a7;color:white;
 font-size:15px;cursor:pointer;
 margin-top:22px;
}
button:disabled{opacity:.65}
#surprise{display:none;margin-top:24px}
#surprise.show{display:block;animation:fade .6s}
@keyframes fade{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:translateY(0)}
}
.message{
 width:100%;min-height:110px;
 margin-top:18px;padding:14px;
 border:1px solid #f0dce5;
 border-radius:15px;
 background:#fffafd;
 font:inherit;font-size:14px;
 resize:vertical;outline:none;
}
.message:focus{border-color:#df89a7}
.status{font-size:13px;line-height:1.7;margin-top:14px}
.foot{color:#c5b4bd;font-size:11px;margin-top:30px}
.heart{
 position:fixed;bottom:-30px;
 color:#e99ab3;pointer-events:none;
 animation:float 9s linear forwards;
 z-index:0;
}
@keyframes float{
 to{transform:translateY(-110vh) rotate(40deg);opacity:0}
}
</style>
</head>
<body>

<main class="card">
 <div class="deco">♡</div>

 <h1>
 世界上最好看的<br>
 <span class="pink">短发女孩</span>
 </h1>

 <p class="aside">（和朵拉无关）</p>

 <p class="aside">这里有一条特意留给你的消息</p>

 <button id="openBtn" onclick="openSurprise()">
 点开看看
 </button>

 <section id="surprise">
   <h3 class="pink">想见你，有缘见 ♡</h3>

   <p class="aside">如果愿意，可以给我留句话。</p>

   <textarea
     id="message"
     class="message"
     maxlength="1000"
     placeholder="想说什么都可以……"
   ></textarea>

   <button id="sendBtn" onclick="sendMessage()">
     发送留言 ♡
   </button>

   <div id="status" class="status" aria-live="polite"></div>
 </section>

 <p class="foot">一份认真准备的小小心意</p>
</main>

<script>
const SUPABASE_URL =
 "https://dqlfwfvhhvwupwuusput.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_cbXLsyPRYaBl_n52KJbY-w_XZL4tO1T";

function openSurprise(){
 document.getElementById("surprise").classList.add("show");
 document.getElementById("openBtn").style.display="none";
}

async function sendMessage(){
 const input=document.getElementById("message");
 const button=document.getElementById("sendBtn");
 const status=document.getElementById("status");

 const content=input.value.trim();

 if(!content){
   status.textContent="先写点什么吧 ♡";
   return;
 }

 button.disabled=true;
 button.textContent="正在发送……";
 status.textContent="";

 try{
   const response=await fetch(
     SUPABASE_URL+"/rest/v1/messages",
     {
       method:"POST",
       headers:{
         "apikey":SUPABASE_KEY,
         "Authorization":"Bearer "+SUPABASE_KEY,
         "Content-Type":"application/json",
         "Prefer":"return=minimal"
       },
       body:JSON.stringify({content:content})
     }
   );

   if(!response.ok){
     throw new Error("发送失败，HTTP "+response.status);
   }

   input.value="";
   input.style.display="none";
   button.style.display="none";

   status.innerHTML=
     '<span class="pink">留言成功，谢谢你 ♡</span>';

 }catch(error){
   status.textContent="发送暂时失败，请稍后再试。";
   button.disabled=false;
   button.textContent="重新发送 ♡";
 }

}

// 飘落爱心
function createHeart(){
 const heart=document.createElement("span");
 heart.className="heart";
 heart.textContent=["♡","♥","୨୧"][
   Math.floor(Math.random()*3)
 ];
 heart.style.left=Math.random()*100+"vw";
 heart.style.fontSize=(12+Math.random()*15)+"px";
 heart.style.animationDuration=(7+Math.random()*5)+"s";
 document.body.appendChild(heart);

 setTimeout(()=>heart.remove(),13000);
}

setInterval(createHeart,900);
</script>
</body>
</html>
