<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5f8">
<title>给你一个小小的惊喜</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:24px 18px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#55434b;background:radial-gradient(ellipse at 12% 18%,#ffd9e6 0,transparent 36%),radial-gradient(ellipse at 88% 82%,#e4dcff 0,transparent 38%),#fff8fb}
#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}.heart{position:absolute;bottom:-40px;color:#e99ab3;opacity:0;animation:float linear forwards}@keyframes float{0%{transform:translate(0,0) rotate(-12deg);opacity:0}12%{opacity:.65}85%{opacity:.4}100%{transform:translate(var(--drift),-110vh) rotate(25deg);opacity:0}}
.card{position:relative;width:min(100%,440px);padding:46px 24px 34px;text-align:center;border:1px solid #f4dfe8;border-radius:30px;background:rgba(255,255,255,.86);box-shadow:0 22px 65px #8051661c;backdrop-filter:blur(10px);animation:enter .7s ease both}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.deco{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 20px;border-radius:50%;background:#fff0f5;color:#df789b;font-size:28px;animation:pulse 2.5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08)}}
h1{margin:0;font-size:clamp(27px,7vw,35px);line-height:1.58;letter-spacing:.5px}.pink{color:#df789b}.aside{margin:12px 0 0;color:#a38e97;font-size:14px;letter-spacing:1.5px}.rule{width:42px;height:2px;margin:27px auto 0;border-radius:9px;background:#f1c5d4}.hint{margin:20px 0 0;color:#a8949c;font-size:13px}
button{margin-top:27px;min-height:48px;padding:0 29px;border:0;border-radius:999px;color:white;background:linear-gradient(100deg,#e99ab4,#d9789b);box-shadow:0 8px 20px #d9789b40;font:inherit;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.97)}
#surprise{display:none;margin:24px auto 0;padding:18px 14px;max-width:330px;border-radius:18px;background:#fff5f8;color:#806b75;font-size:14px;line-height:1.9}#surprise.show{display:block;animation:reveal .5s ease both}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{margin:31px 0 0;color:#c5b4bd;font-size:11px;letter-spacing:1px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<main class="card">
  <div class="deco" aria-hidden="true">♡</div>
  <h1>世界上最好看的<br><span class="pink">短发女孩</span></h1>
  <p class="aside">（和朵拉无关）</p>
  <div class="rule"></div>
  <p class="hint">这里有一条特意留给你的消息</p>
  <button id="revealBtn" type="button" aria-expanded="false" aria-controls="surprise">点开看看</button>
  <section class="surprise" id="surprise">
    <span class="pink">是你教会，我的天老爷 ♡</span>
  </section>
  <p class="foot">一份认真准备的小小心意</p>
</main>
<script>
(function(){
 var layer=document.getElementById('hearts'),btn=document.getElementById('revealBtn'),box=document.getElementById('surprise');
 var symbols=['♡','♥','୨୧'];
 function heart(){
  if(document.hidden)return;
  var el=document.createElement('span');el.className='heart';
  el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  el.style.left=Math.random()*100+'vw';el.style.fontSize=12+Math.random()*15+'px';
  el.style.animationDuration=8+Math.random()*7+'s';el.style.setProperty('--drift',Math.random()*100-50+'px');
  layer.appendChild(el);setTimeout(function(){el.remove()},16000);
 }
 for(var i=0;i<9;i++)setTimeout(heart,i*420);
 setInterval(heart,950);
 btn.addEventListener('click',function(){box.classList.add('show');btn.setAttribute('aria-expanded','true');btn.textContent='这次真的说完啦';btn.disabled=true;});
})();
</script>
</body>
</html>
